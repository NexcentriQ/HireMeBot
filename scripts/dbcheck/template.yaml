AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  LOCAL ONLY (never deploy): runs the read-only DbConnectivityCheck handler inside each Lambda module's own runtime
  package to prove that it can connect to the configured MySQL. No API, no IAM, no secrets. Used by
  scripts/Test-DbConnectivity.ps1 with `sam local invoke`.

Resources:
  RecruiterFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../../RecruiterLambda
      Handler: org.hmb.diagnostics.DbConnectivityCheck::handleRequest
      Runtime: java21
      Architectures:
        - x86_64
      MemorySize: 512
      Timeout: 30
      Environment:
        Variables:
          DB_HOST: ""
          DB_PORT: "3306"
          DB_NAME: ""
          DB_USERNAME: ""
          DB_PASSWORD: ""
          DB_SSL_MODE: VERIFY_IDENTITY
          DB_TRUSTSTORE_URL: ""
          DB_TRUSTSTORE_PASSWORD: ""
          DB_TRUSTSTORE_TYPE: PKCS12
  StudentFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../../StudentLambda
      Handler: org.hmb.diagnostics.DbConnectivityCheck::handleRequest
      Runtime: java21
      Architectures:
        - x86_64
      MemorySize: 512
      Timeout: 30
      Environment:
        Variables:
          DB_HOST: ""
          DB_PORT: "3306"
          DB_NAME: ""
          DB_USERNAME: ""
          DB_PASSWORD: ""
          DB_SSL_MODE: VERIFY_IDENTITY
          DB_TRUSTSTORE_URL: ""
          DB_TRUSTSTORE_PASSWORD: ""
          DB_TRUSTSTORE_TYPE: PKCS12
  DocumentManagementFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../../DocumentManagementLambda
      Handler: org.hmb.diagnostics.DbConnectivityCheck::handleRequest
      Runtime: java21
      Architectures:
        - x86_64
      MemorySize: 512
      Timeout: 30
      Environment:
        Variables:
          DB_HOST: ""
          DB_PORT: "3306"
          DB_NAME: ""
          DB_USERNAME: ""
          DB_PASSWORD: ""
          DB_SSL_MODE: VERIFY_IDENTITY
          DB_TRUSTSTORE_URL: ""
          DB_TRUSTSTORE_PASSWORD: ""
          DB_TRUSTSTORE_TYPE: PKCS12
  RegistrationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../../Registration
      Handler: org.hmb.diagnostics.DbConnectivityCheck::handleRequest
      Runtime: java21
      Architectures:
        - x86_64
      MemorySize: 512
      Timeout: 30
      Environment:
        Variables:
          DB_HOST: ""
          DB_PORT: "3306"
          DB_NAME: ""
          DB_USERNAME: ""
          DB_PASSWORD: ""
          DB_SSL_MODE: VERIFY_IDENTITY
          DB_TRUSTSTORE_URL: ""
          DB_TRUSTSTORE_PASSWORD: ""
          DB_TRUSTSTORE_TYPE: PKCS12
          DB_SECRET_ARN: ""
