AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  HireMeBot

  Sample SAM Template for HireMeBot

Parameters:
  PortalOrigin:
    Type: String
    Default: "http://localhost:5173"
    AllowedPattern: '^https?://[^*\s]+$'
    ConstraintDescription: One explicit origin such as https://portal.example.com (no wildcards).
    Description: >
      The single browser origin of the Recruiter Portal. It is the only origin allowed by CORS on the HTTP API and on
      direct uploads to the documents bucket. The default is the Vite dev server for local work; pass the real portal
      origin on deploy.
  ReconcileSchedule:
    Type: String
    Default: "rate(3 hours)"
    Description: How often the document reconciler runs (an EventBridge schedule expression).
  AlarmTopicArn:
    Type: String
    Default: ""
    Description: Optional SNS topic that is notified when the document reconciler fails or finds a problem.

Conditions:
  HasAlarmTopic: !Not [!Equals [!Ref AlarmTopicArn, ""]]

Globals:
  Function:
    Timeout: 20
    MemorySize: 512
  HttpApi:
    # Needed because the portal calls the API from the browser. One explicit origin, never a wildcard. The X-Dev-*
    # headers exist only for local development; with production authentication they are replaced by Authorization.
    CorsConfiguration:
      AllowOrigins:
        - !Ref PortalOrigin
      AllowMethods:
        - GET
        - POST
        - OPTIONS
      AllowHeaders:
        - Content-Type
        - Authorization
        - X-Dev-Recruiter-Id
        - X-Dev-Student-Id
      MaxAge: 600

Resources:
  RecruiterFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: RecruiterLambda
      Handler: org.hmb.handler.RecruiterLambdaHandler::handleRequest
      Runtime: java21
      Architectures:
        - x86_64
      MemorySize: 512
      Environment:
        # Placeholders only. Real values for local runs go in env.json (see env.json.example, which is
        # passed with `sam local start-api --env-vars env.json`). Variables must be declared here for
        # --env-vars to override them. Never commit real credentials.
        Variables:
          DB_HOST: ""
          DB_PORT: "3306"
          DB_NAME: ""
          DB_USERNAME: ""
          DB_PASSWORD: ""
          DB_SSL_MODE: VERIFY_IDENTITY
          DB_TRUSTSTORE_URL: ""
          DB_TRUSTSTORE_PASSWORD: ""
          DB_TRUSTSTORE_TYPE: PKCS12
          # X-Dev-Recruiter-Id is NOT authentication. Keep "false" for any deployed stack; only the
          # local env.json turns it on. Replace with Cognito/JWT before exposing this API.
          ALLOW_DEV_RECRUITER_HEADER: "false"
      Events:
        CreateApplication:
          Type: HttpApi
          Properties:
            Path: /api/v1/recruiter/applications
            Method: post
        ListAssignedStudents:
          Type: HttpApi
          Properties:
            Path: /api/v1/recruiter/students
            Method: get

  StudentFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: StudentLambda
      Handler: org.hmb.handler.StudentLambdaHandler::handleRequest
      Runtime: java21
      Architectures:
        - x86_64
      MemorySize: 512
      Environment:
        # Same pattern as RecruiterFunction: placeholders only, real values in env.json (local runs).
        Variables:
          DB_HOST: ""
          DB_PORT: "3306"
          DB_NAME: ""
          DB_USERNAME: ""
          DB_PASSWORD: ""
          DB_SSL_MODE: VERIFY_IDENTITY
          DB_TRUSTSTORE_URL: ""
          DB_TRUSTSTORE_PASSWORD: ""
          DB_TRUSTSTORE_TYPE: PKCS12
          # "Today" and the monthly/weekly reporting periods are calendar ranges in this zone.
          APP_TIMEZONE: America/Chicago
          # Per-weekday application target; the monthly target is this times the weekdays in the month.
          DAILY_APPLICATION_TARGET: "50"
          # X-Dev-Student-Id is NOT authentication. Keep "false" for any deployed stack; only the
          # local env.json turns it on. Replace with Cognito/JWT before exposing this API.
          ALLOW_DEV_STUDENT_HEADER: "false"
      Events:
        ListApplications:
          Type: HttpApi
          Properties:
            Path: /api/v1/student/applications
            Method: get

  # ---- Document upload (resumes) -------------------------------------------------------------------------------
  # Browser -> presigned PUT -> this private bucket. Nothing here is public; the bucket never serves a GET.
  DocumentsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      # No fixed BucketName: CloudFormation generates a unique one.
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - BucketKeyEnabled: true
            ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      # Safety net: if a registered object were ever expired by mistake, the file stays recoverable for 30 days.
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          # Uploads are tagged doc-state=pending by the presigned URL and retagged registered once they are in MySQL.
          # Only pending objects ever expire, so abandoned and lost-race uploads clean themselves up. The reconciler
          # retags any registered object still pending long before this fires. Nothing in the system deletes objects.
          - Id: ExpireUnregisteredUploads
            Status: Enabled
            TagFilters:
              - Key: doc-state
                Value: pending
            ExpirationInDays: 7
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            Prefix: students/
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      # Direct uploads from the browser: PUT from the one portal origin, with exactly the signed headers.
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - !Ref PortalOrigin
            AllowedMethods:
              - PUT
            AllowedHeaders:
              - content-type
              - x-amz-checksum-sha256
              - x-amz-tagging
            ExposedHeaders:
              - ETag
            MaxAge: 3600

  DocumentsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DocumentsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt DocumentsBucket.Arn
              - !Sub "${DocumentsBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  # HMAC key that signs upload-intent tokens. Generated by Secrets Manager; never in source, env files or logs.
  UploadSigningSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: HMAC key used to sign HireMeBot document upload tokens
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true

  DocumentManagementFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: DocumentManagementLambda
      Handler: org.hmb.handler.DocumentLambdaHandler::handleRequest
      Runtime: java21
      Architectures:
        - x86_64
      MemorySize: 512
      Environment:
        # Placeholders and safe defaults. For local runs set real values in env.json (see env.json.example): under
        # `sam local` DOCUMENTS_BUCKET and UPLOAD_SIGNING_SECRET_ID below would only be the resource names.
        Variables:
          DB_HOST: ""
          DB_PORT: "3306"
          DB_NAME: ""
          DB_USERNAME: ""
          DB_PASSWORD: ""
          DB_SSL_MODE: VERIFY_IDENTITY
          DB_TRUSTSTORE_URL: ""
          DB_TRUSTSTORE_PASSWORD: ""
          DB_TRUSTSTORE_TYPE: PKCS12
          # X-Dev-Recruiter-Id is NOT authentication. Keep "false" for any deployed stack. The code additionally
          # refuses the header unless the process runs under `sam local`, so a deployed stack answers 403 to every
          # call until production authentication exists. Production authentication (Cognito/JWT mapped to a
          # recruiter) is a prerequisite before these APIs are exposed.
          ALLOW_DEV_RECRUITER_HEADER: "false"
          DOCUMENTS_BUCKET: !Ref DocumentsBucket
          UPLOAD_SIGNING_SECRET_ID: !Ref UploadSigningSecret
          # Local only (honoured only under `sam local`): signs tokens when no Secrets Manager secret is used.
          UPLOAD_TOKEN_SECRET_DEV: ""
          UPLOAD_URL_EXPIRY_SECONDS: "300"
          UPLOAD_TOKEN_TTL_SECONDS: "1800"
          DOCUMENT_RESUME_ENABLED: "true"
          DOCUMENT_RESUME_MAX_SIZE_MB: "5"
          # Defined but not enabled in V1.
          DOCUMENT_COVER_LETTER_ENABLED: "false"
          DOCUMENT_COVER_LETTER_MAX_SIZE_MB: "5"
      Policies:
        - Version: '2012-10-17'
          Statement:
            # The role signs the presigned PUT, so it needs PutObject and PutObjectTagging (the URL sets the tag).
            - Sid: PresignAndTagUploads
              Effect: Allow
              Action:
                - s3:PutObject
                - s3:PutObjectTagging
              Resource: !Sub "${DocumentsBucket.Arn}/students/*"
            # HeadObject and the two tiny ranged reads used to verify an upload.
            - Sid: VerifyUploads
              Effect: Allow
              Action: s3:GetObject
              Resource: !Sub "${DocumentsBucket.Arn}/students/*"
            # Without ListBucket, S3 answers 403 instead of 404 for a missing key, which would make "the file is
            # missing" indistinguishable from a permission bug. This bucket holds only documents and the code never
            # lists it. (A prefix condition would not apply to HeadObject, so none is used.)
            - Sid: DistinguishMissingFromForbidden
              Effect: Allow
              Action: s3:ListBucket
              Resource: !GetAtt DocumentsBucket.Arn
            - Sid: ReadUploadSigningSecret
              Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref UploadSigningSecret
            # Deliberately absent: s3:DeleteObject. Only the lifecycle rule ever removes an object.
      Events:
        RequestUploadUrl:
          Type: HttpApi
          Properties:
            Path: /api/v1/documents/upload-url
            Method: post
        RegisterDocument:
          Type: HttpApi
          Properties:
            Path: /api/v1/documents/register
            Method: post

  # Scheduled job, not an API. Heals objects whose MySQL row exists but whose tag is still `pending` (the tagging
  # step failed after the insert). It never deletes anything and never writes to MySQL.
  DocumentReconciliationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: DocumentManagementLambda
      Handler: org.hmb.handler.DocumentReconciliationHandler::handleRequest
      Runtime: java21
      Architectures:
        - x86_64
      MemorySize: 512
      Timeout: 300
      Environment:
        Variables:
          DB_HOST: ""
          DB_PORT: "3306"
          DB_NAME: ""
          DB_USERNAME: ""
          DB_PASSWORD: ""
          DB_SSL_MODE: VERIFY_IDENTITY
          DB_TRUSTSTORE_URL: ""
          DB_TRUSTSTORE_PASSWORD: ""
          DB_TRUSTSTORE_TYPE: PKCS12
          DOCUMENTS_BUCKET: !Ref DocumentsBucket
          # Must stay below the 7-day expiry of pending objects (the code enforces at most 6).
          RECONCILE_LOOKBACK_DAYS: "5"
          RECONCILE_BATCH_SIZE: "500"
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Sid: ReadAndSetRegisteredTag
              Effect: Allow
              Action:
                - s3:GetObjectTagging
                - s3:PutObjectTagging
              Resource: !Sub "${DocumentsBucket.Arn}/students/*"
            - Sid: DistinguishMissingFromForbidden
              Effect: Allow
              Action: s3:ListBucket
              Resource: !GetAtt DocumentsBucket.Arn
      Events:
        Schedule:
          Type: Schedule
          Properties:
            Schedule: !Ref ReconcileSchedule
            Enabled: true

  # The reconciler fails its invocation when it finds a missing file, cannot check a row, or cannot finish.
  DocumentReconciliationErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The document reconciler failed or found a registered document without its file.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref DocumentReconciliationFunction
      Statistic: Sum
      Period: 21600
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlarmTopic
        - - !Ref AlarmTopicArn
        - !Ref AWS::NoValue

Outputs:
  RecruiterApplicationsUrl:
    Description: "HTTP API URL for POST /api/v1/recruiter/applications"
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/api/v1/recruiter/applications"
  RecruiterStudentsUrl:
    Description: "HTTP API URL for GET /api/v1/recruiter/students"
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/api/v1/recruiter/students"
  RecruiterFunction:
    Description: "Recruiter Lambda Function ARN"
    Value: !GetAtt RecruiterFunction.Arn
  RecruiterFunctionIamRole:
    Description: "Implicit IAM Role created for Recruiter function"
    Value: !GetAtt RecruiterFunctionRole.Arn
  StudentApplicationsUrl:
    Description: "HTTP API URL for GET /api/v1/student/applications"
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/api/v1/student/applications"
  StudentFunction:
    Description: "Student Lambda Function ARN"
    Value: !GetAtt StudentFunction.Arn
  StudentFunctionIamRole:
    Description: "Implicit IAM Role created for Student function"
    Value: !GetAtt StudentFunctionRole.Arn
  DocumentUploadUrlEndpoint:
    Description: "HTTP API URL for POST /api/v1/documents/upload-url"
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/api/v1/documents/upload-url"
  DocumentRegisterEndpoint:
    Description: "HTTP API URL for POST /api/v1/documents/register"
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/api/v1/documents/register"
  DocumentsBucketName:
    Description: "Private bucket that holds uploaded documents"
    Value: !Ref DocumentsBucket
  DocumentManagementFunction:
    Description: "Document upload Lambda Function ARN"
    Value: !GetAtt DocumentManagementFunction.Arn
  DocumentReconciliationFunction:
    Description: "Document reconciler Lambda Function ARN"
    Value: !GetAtt DocumentReconciliationFunction.Arn
