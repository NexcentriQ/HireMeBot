AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  HireMeBot

  Sample SAM Template for HireMeBot

Globals:
  Function:
    Timeout: 20
    MemorySize: 512

Resources:
  RecruiterFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: RecruiterLambda
      Handler: org.hmb.handler.RecruiterLambdaHandler::handleRequest
      Runtime: java21
      Architectures:
        - x86_64
      MemorySize: 512
      Environment:
        # Placeholders only. Real values for local runs go in env.json (see env.json.example, which is
        # passed with `sam local start-api --env-vars env.json`). Variables must be declared here for
        # --env-vars to override them. Never commit real credentials.
        Variables:
          DB_HOST: ""
          DB_PORT: "3306"
          DB_NAME: ""
          DB_USERNAME: ""
          DB_PASSWORD: ""
          DB_SSL_MODE: VERIFY_IDENTITY
          DB_TRUSTSTORE_URL: ""
          DB_TRUSTSTORE_PASSWORD: ""
          DB_TRUSTSTORE_TYPE: PKCS12
          # X-Dev-Recruiter-Id is NOT authentication. Keep "false" for any deployed stack; only the
          # local env.json turns it on. Replace with Cognito/JWT before exposing this API.
          ALLOW_DEV_RECRUITER_HEADER: "false"
      Events:
        CreateApplication:
          Type: HttpApi
          Properties:
            Path: /api/v1/recruiter/applications
            Method: post

  StudentFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: StudentLambda
      Handler: org.hmb.handler.StudentLambdaHandler::handleRequest
      Runtime: java21
      Architectures:
        - x86_64
      MemorySize: 512
      Environment:
        # Same pattern as RecruiterFunction: placeholders only, real values in env.json (local runs).
        Variables:
          DB_HOST: ""
          DB_PORT: "3306"
          DB_NAME: ""
          DB_USERNAME: ""
          DB_PASSWORD: ""
          DB_SSL_MODE: VERIFY_IDENTITY
          DB_TRUSTSTORE_URL: ""
          DB_TRUSTSTORE_PASSWORD: ""
          DB_TRUSTSTORE_TYPE: PKCS12
          # "Today" and the monthly/weekly reporting periods are calendar ranges in this zone.
          APP_TIMEZONE: America/Chicago
          # Per-weekday application target; the monthly target is this times the weekdays in the month.
          DAILY_APPLICATION_TARGET: "50"
          # X-Dev-Student-Id is NOT authentication. Keep "false" for any deployed stack; only the
          # local env.json turns it on. Replace with Cognito/JWT before exposing this API.
          ALLOW_DEV_STUDENT_HEADER: "false"
      Events:
        ListApplications:
          Type: HttpApi
          Properties:
            Path: /api/v1/student/applications
            Method: get

Outputs:
  RecruiterApplicationsUrl:
    Description: "HTTP API URL for POST /api/v1/recruiter/applications"
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/api/v1/recruiter/applications"
  RecruiterFunction:
    Description: "Recruiter Lambda Function ARN"
    Value: !GetAtt RecruiterFunction.Arn
  RecruiterFunctionIamRole:
    Description: "Implicit IAM Role created for Recruiter function"
    Value: !GetAtt RecruiterFunctionRole.Arn
  StudentApplicationsUrl:
    Description: "HTTP API URL for GET /api/v1/student/applications"
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/api/v1/student/applications"
  StudentFunction:
    Description: "Student Lambda Function ARN"
    Value: !GetAtt StudentFunction.Arn
  StudentFunctionIamRole:
    Description: "Implicit IAM Role created for Student function"
    Value: !GetAtt StudentFunctionRole.Arn
